# Gitleaks configuration.
#
# The CI action only reads this file when GITLEAKS_CONFIG points at it; without
# it gitleaks scans with its built-in rules and flags Spring Security's
# generated dev password that every local startup writes into log files.
#
# Note on regexTarget: gitleaks allowlists default to matching against the
# secret value ("match"). A path list therefore needs an explicit
# regexTarget = "path", otherwise the entries are applied to the wrong string
# and silently do nothing.

[extend]
useDefault = true

# Documented dev-only placeholder values. Kept as a second line of defence for
# occurrences outside the files listed below.
[[allowlists]]
description = "Documented dev-only placeholders"
regexTarget = "match"
regexes = [
  "dev-secret-do-not-use-in-production-32chars!",
  "minioadmin",
  "testroot",
  "please-change-me",
]

# Files whose contents are intentional placeholders or local artefacts.
#
# application-dev.yml is the dev profile: every credential in it is an explicit
# placeholder that production must override, and gitleaks' generic-api-key rule
# matches the surrounding YAML context rather than just the value. Production is
# unaffected — application.yml carries no credentials and JWT_SECRET has no
# default outside dev.
[[allowlists]]
description = "Example, docs, tests, dev profile and local logs"
regexTarget = "path"
paths = [
  "^\\.env\\.example$",
  "^docs/",
  "README\\.md$",
  "REPRODUCE\\.md$",
  "^backend/src/test/",
  "^backend/src/main/resources/application-dev\\.yml$",
  "logs/",
  "\\.log$",
  "\\.log\\.[0-9]",
  "\\.gz$",
]
