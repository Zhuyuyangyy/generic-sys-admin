# Gitleaks configuration.
#
# The CI action passes this file via GITLEAKS_CONFIG. Without it gitleaks falls
# back to its built-in rules, which flag the Spring Security generated password
# that every local startup prints into backend/logs/.

[extend]
useDefault = true

# Documented dev-only placeholder values, matched against the whole finding so
# that "secret-key: minioadmin" and "access-key: minioadmin" both hit.
[[allowlists]]
description = "Documented dev-only placeholders"
regexTarget = "match"
regexes = [
  "dev-secret-do-not-use-in-production-32chars!",
  "minioadmin",
  "testroot",
  "please-change-me",
  "DB_PASSWORD:1234",
  "dev-secret-do-not-use",
]

# Files that intentionally show placeholders. application-dev.yml is the dev
# profile and every credential in it is an explicit placeholder that production
# must override; gitleaks' generic-api-key rule matches the surrounding YAML
# context, so allowing the values alone is not enough.
[[allowlists]]
description = "Example, docs, tests and the dev profile"
paths = [
  "^\\.env\\.example$",
  "^docs/",
  "README\\.md$",
  "REPRODUCE\\.md$",
  "^backend/src/test/",
  "^backend/src/main/resources/application-dev\\.yml$",
]

# Local run logs: ignored by .gitignore now, but guard against a re-add.
[[allowlists]]
description = "Local run logs"
paths = [
  "logs/",
  "\\.log$",
  "\\.log\\.[0-9]+",
  "\\.gz$",
]
