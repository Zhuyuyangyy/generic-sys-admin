# Gitleaks configuration.
#
# The CI action passes this file via GITLEAKS_CONFIG. Without it gitleaks falls
# back to its built-in rules, which flag the Spring Security generated password
# that every local startup prints into backend/logs/.

[extend]
useDefault = true

# Documented dev-only placeholder values.
[[allowlists]]
description = "Documented dev-only placeholders"
regexTarget = "match"
regexes = [
  "dev-secret-do-not-use-in-production-32chars!",
  "minioadmin",
  "testroot",
  "please-change-me",
]

# Files that intentionally show placeholders.
[[allowlists]]
description = "Example, docs and test resources"
paths = [
  "^\\.env\\.example$",
  "^docs/",
  "README\\.md$",
  "REPRODUCE\\.md$",
  "^backend/src/test/",
]

# Local run logs: ignored by .gitignore now, but guard against a re-add.
[[allowlists]]
description = "Local run logs"
paths = [
  "logs/",
  "\\.log$",
  "\\.log\\.[0-9]+",
  "\\.gz$",
]
