# Gitleaks configuration.
#
# The CI action only reads this file when GITLEAKS_CONFIG points at it; without
# it gitleaks scans with its built-in rules and flags Spring Security's
# generated dev password that every local startup writes into log files.
#
# Note on regexTarget: a gitleaks allowlist defaults to matching the secret
# value ("match"). A path list therefore needs an explicit regexTarget = "path",
# otherwise its patterns are applied to the wrong string and silently do nothing.

[extend]
useDefault = true

# Local run logs and build output. Never tracked; kept here so that a log file
# re-added to the index is still allowed, since logs legitimately contain the
# Spring Security generated dev password.
[[allowlists]]
description = "Local logs, rotated archives and build output"
regexTarget = "path"
paths = [
  "logs/",
  "\\.log$",
  "\\.log\\.[0-9]",
  "\\.gz$",
  "target/",
]

# Documentation that intentionally shows placeholder values.
[[allowlists]]
description = "Docs and env examples"
regexTarget = "path"
paths = [
  "^\\.env\\.example$",
  "^docs/",
  "README\\.md$",
  "REPRODUCE\\.md$",
]

# Known pre-existing exposure on master's history.
#
# A MiniMax API key was committed in 8e318ce / a6d09be and removed in a later
# commit on that same branch. Those commits are ancestors of origin/master and
# are not part of any PR opened against it, so a history scan cannot avoid
# them. The branch stabilization-ci-verification has this key stripped from its
# own rewritten history (git filter-repo --replace-text).
#
# The allowlist deliberately does NOT contain any part of the key: reproducing
# even a prefix here would itself put secret material in the working tree and be
# flagged by the same scan. Since gitleaks' generic-api-key rule matches on the
# surrounding context, matching on the key is not what suppresses that finding
# on master's history anyway.
#
# This job therefore scans the working tree (see ci.yml), where no credential
# literal exists at all. Cleaning master's history is a separate deliberate
# action because it rewrites a shared branch.

# No application profile is allowlisted on purpose. application-dev.yml used to
# contain a MinIO default, a dev DB password and a JWT placeholder; all three
# were removed and the dev profile now requires explicit JWT_SECRET / DB_PASSWORD
# like every other profile, so there is nothing to excuse.
