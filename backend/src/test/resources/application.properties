# Test-only properties.
#
# application.yml sets sys.config.security.jwt-secret to ${JWT_SECRET:} with no
# default, so the app fails fast unless a real secret is supplied. That is the
# desired production behaviour, but tests must still boot a full context, so a
# non-placeholder test secret is provided here. It is loaded automatically for
# every @SpringBootTest and is never used outside the test classpath.
sys.config.security.jwt-secret=test-secret-key-must-be-at-least-32-chars-long-for-hs256!
sys.config.security.jwt-expiration=7200
sys.config.security.jwt-refresh-expiration=604800

# Unit tests use H2 and do not apply the MySQL migrations.
# Real migrations are exercised by MigrationIT against Testcontainers.
spring.flyway.enabled=false
