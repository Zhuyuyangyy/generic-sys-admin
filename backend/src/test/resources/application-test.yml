server:
  port: 0

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  h2:
    console:
      enabled: true

  flyway:
    enabled: false

  # Auto-configure embedded Redis mock via testcontainers or embedded library
  # For simple unit tests, Redis auto-config is excluded via @DataJpaTest etc.
  redis:
    host: localhost
    port: 6379

  # Disable security for integration tests where needed
  security:
    filter:
      order: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zyy.**.model
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-secret-key-for-integration-testing-minimum-32-chars
  expiration: 7200
  refresh-expiration: 604800

# 顶层 minio.* 是 MinioConfig 直接读取的属性；test profile 之前只定义了
# sys.config.storage.*，导致 MinioConfig 启动即
# "Could not resolve placeholder 'minio.endpoint'"。
# endpoint 用一个刻意不可路由的地址，让 MinioConfig 走本地存储降级。
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:99999}
  access-key: ${MINIO_ACCESS_KEY:test}
  secret-key: ${MINIO_SECRET_KEY:test}
  bucket-name: ${MINIO_BUCKET:test-bucket}

minimax:
  api-url: https://api.minimax.chat
  app-id: ""
  api-key: ""
  group-id: ""

# Application configuration mapping for AppProperties
sys:
  config:
    security:
      jwt-secret: test-secret-key-for-integration-testing-minimum-32-chars
      jwt-expiration: 7200
      jwt-refresh-expiration: 604800
      bcrypt-cost-factor: 4
      max-failed-attempts: 5
      lockout-minutes: 30
    storage:
      endpoint: http://localhost:9000
      access-key: test-access-key
      secret-key: test-secret-key
      bucket-name: test-bucket
    app:
      demo-mode: true
      audit-enabled: true
      doc-enabled: false

logging:
  level:
    root: WARN
    com.zyy: DEBUG
