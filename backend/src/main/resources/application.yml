server:
  port: 8080

spring:
  application:
    name: generic-sys-admin
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:generic_sys_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 不设 baseline-version：V1__init_schema.sql 本身就是 version 1，
    # baseline-version=1 会让 Flyway 同时登记一条 version 1 的 baseline 记录，
    # 启动即 "Found more than one migration with version 1.0"，
    # 进而 sqlSessionFactory 构建失败、整个容器起不来。
    # baseline-on-migrate 仅在数据库非空且无 history 表时才需要。

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zyy.**.model
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT配置
jwt:
  secret: ${JWT_SECRET:please-change-this-secret-in-production-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:7200}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

# Minimax TTS配置
minimax:
  api-url: https://api.minimax.chat
  app-id: ${MINIMAX_APP_ID:}
  api-key: ${MINIMAX_API_KEY:}
  group-id: ${MINIMAX_GROUP_ID:}

# 日志配置
logging:
  level:
    root: INFO
    com.zyy: DEBUG
    com.zyy.aspect: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Security hardening configuration
security:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    api-max-per-minute: ${RATE_LIMIT_API_MAX:100}
    login-max-per-minute: ${RATE_LIMIT_LOGIN_MAX:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload:
    allowed-mime-types: image/jpeg,image/png,image/gif,application/pdf,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document
  token-blacklist:
    enabled: ${TOKEN_BLACKLIST_ENABLED:true}
