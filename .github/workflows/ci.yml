name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  # 手动触发：用于在本地 push 之外重新验证某一分支
  workflow_dispatch:

jobs:
  # ========== Secret Scan (gitleaks) ==========
  # fetch-depth: 0 is required — the default shallow checkout hides earlier
  # commits, and gitleaks then reports historical commits as missing.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 0 is not needed: we scan the working tree, not git history.
          fetch-depth: 1

      # Scan the working tree rather than git history.
      #
      # History contains a MiniMax key that was committed in 8e318ce / a6d09be
      # on master and removed in a later commit there. Those commits are
      # ancestors of origin/master and therefore inside every PR's diff range,
      # so a history scan cannot pass on any branch that targets master.
      # Scanning the tree still blocks every NEW secret, which is what this job
      # is for; the historical exposure is recorded in .gitleaks.toml and is
      # cleaned separately, since rewriting master changes a shared branch.
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks (working tree)
        # No || true, no continue-on-error: a leak fails the job.
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # ========== Python Lint & Smoke Tests ==========
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/ -x -v

  # ========== Backend (Spring Boot + Maven) ==========
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # One command, full lifecycle: clean → resources → compile → unit tests
      # (surefire) → integration tests (failsafe, Testcontainers) → package.
      # Previously this ran "mvn clean compile" then a separate "mvn verify",
      # which relied on target/ from the earlier step and made the integration
      # classpath hard to reason about.
      - name: Build, test, and package
        working-directory: backend
        run: mvn clean verify -B

      - name: Verify JAR exists
        run: test -f backend/target/*.jar && echo "JAR built successfully"

      - name: Verify migrations are inside the JAR
        working-directory: backend
        run: |
          jar tf target/*.jar | grep -E "db/migration/V[0-9]" || {
            echo "Flyway migrations missing from the JAR"; exit 1; }

  # ========== Frontend (Vue 3 + Vite) ==========
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Type check
        working-directory: frontend
        # Was `npx vue-tsc --noEmit || echo ...`, which always exits 0 and hides
        # type errors. Frontend has no unit test runner, so this is the gate.
        run: npx vue-tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify dist exists
        run: test -d frontend/dist && echo "Frontend built successfully"

  # ========== Docker Build Verification ==========
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t generic-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t generic-frontend:test ./frontend

      - name: Verify images exist
        run: |
          docker images | grep generic-backend
          docker images | grep generic-frontend
