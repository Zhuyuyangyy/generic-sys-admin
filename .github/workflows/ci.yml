name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  # ========== Secret Scan (gitleaks) ==========
  # fetch-depth: 0 is required — the default shallow checkout hides earlier
  # commits, and gitleaks then reports historical commits as missing.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "true"

  # ========== Python Lint & Smoke Tests ==========
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/ -x -v

  # ========== Backend (Spring Boot + Maven) ==========
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build backend
        working-directory: backend
        run: mvn clean compile -B

      - name: Run unit tests
        working-directory: backend
        # Previously this pinned -Dtest=SmokeTest,JwtUtilTest, which silently
        # skipped the rest of the suite (and hid 15 context-load failures).
        # verify (not test) so the failsafe integration phase runs too.
        run: mvn verify -B

      - name: Package backend
        working-directory: backend
        run: mvn package -DskipTests -B

      - name: Verify JAR exists
        run: test -f backend/target/*.jar && echo "JAR built successfully"

  # ========== Frontend (Vue 3 + Vite) ==========
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Type check
        working-directory: frontend
        # Was `npx vue-tsc --noEmit || echo ...`, which always exits 0 and hides
        # type errors. Frontend has no unit test runner, so this is the gate.
        run: npx vue-tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify dist exists
        run: test -d frontend/dist && echo "Frontend built successfully"

  # ========== Docker Build Verification ==========
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t generic-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t generic-frontend:test ./frontend

      - name: Verify images exist
        run: |
          docker images | grep generic-backend
          docker images | grep generic-frontend
