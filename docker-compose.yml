# ========== Generic Sys Admin - 全量部署 ==========
# 启动：docker-compose up -d
# 停止：docker-compose down
# 查看日志：docker-compose logs -f

services:

  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: generic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: generic_sys_admin
      MYSQL_USER: generic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-generic123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - generic-net

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: generic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - generic-net

  # ========== 后端服务 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: generic-backend
    restart: unless-stopped
    environment:
      # 数据库（使用 docker-compose 服务名）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: generic_sys_admin
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT 密钥（生产必须修改！）
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-strong-random-key}
      # MiniMax AI（可选）
      MINIMAX_API_URL: ${MINIMAX_API_URL:-https://api.minimax.chat}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_APP_ID: ${MINIMAX_APP_ID:-}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID:-}
      # MinIO（可选）
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # 日志级别
      LOG_LEVEL_MAPPER: warn
      # API 文档开关
      DOC_ENABLED: "false"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - generic-net

  # ========== 前端服务 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: generic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - generic-net

# ========== 网络 ==========
networks:
  generic-net:
    driver: bridge

# ========== 数据卷 ==========
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
