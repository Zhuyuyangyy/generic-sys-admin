version: '3.8'

# =============================================
# Generic Sys Admin - Docker Compose Orchestration
# =============================================
# This file defines the complete service stack for local development
# and production deployment.
#
# Usage:
#   Development: docker-compose up -d
#   With monitoring: docker-compose --profile monitoring up -d
#   Frontend only: docker-compose --profile frontend up -d
# =============================================

services:
  # =============================================
  # MySQL 8.0 Database
  # =============================================
  mysql:
    image: mysql:8.0
    container_name: generic-sys-admin-mysql
    restart: unless-stopped
    profiles:
      - full
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: generic_sys_admin
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin123}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/v1.0__init.sql:/docker-entrypoint-initdb.d/v1.0__init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - generic-sys-admin-network

  # =============================================
  # Redis 7 Cache Layer
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: generic-sys-admin-redis
    restart: unless-stopped
    profiles:
      - full
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - generic-sys-admin-network

  # =============================================
  # MinIO Object Storage
  # =============================================
  minio:
    image: minio/minio:latest
    container_name: generic-sys-admin-minio
    restart: unless-stopped
    profiles:
      - full
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: generic-sys-admin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - generic-sys-admin-network

  # =============================================
  # Spring Boot Backend Application
  # =============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: generic-sys-admin-backend
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Database Configuration
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: generic_sys_admin
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-please-override-in-production-environment}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200}
      
      # MinIO Configuration
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      
      # Application Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-prod}
      SYSPROFILE_CONFIG_APP_DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - generic-sys-admin-network

  # =============================================
  # Vue.js Frontend Application
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: generic-sys-admin-frontend
    restart: unless-stopped
    profiles:
      - frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      VITE_API_BASE_URL: http://localhost:${SERVER_PORT:-8080}
      VITE_APP_TITLE: Generic Sys Admin
    depends_on:
      - backend
    networks:
      - generic-sys-admin-network

# =============================================
# Volume Definitions
# =============================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# =============================================
# Network Definitions
# =============================================
networks:
  generic-sys-admin-network:
    driver: bridge
    name: generic-sys-admin-network
